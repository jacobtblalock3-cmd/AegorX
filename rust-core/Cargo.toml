[package]
name = "aegorx-core"
version = "0.1.0"
edition = "2021"
description = "Performance-critical primitives for the AegorX antivirus engine"

[lib]
name = "_aegorx_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", optional = true }
sha2 = "0.10"

[features]
# opt-in for building the Python extension module (e.g. via maturin);
# kept off by default so `cargo test` links without libpython.
extension-module = ["pyo3/extension-module", "dep:pyo3"]

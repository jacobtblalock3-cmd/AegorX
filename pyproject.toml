[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defentra"
version = "1.0.0"
description = "Defentra - open-source AI-assisted antivirus engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Defentra Project" }]
keywords = ["antivirus", "security", "malware", "yara", "machine-learning"]
dependencies = ["cryptography>=41.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/jacobtblalock3-cmd/defentra"
Security = "https://github.com/jacobtblalock3-cmd/defentra/blob/main/SECURITY.md"

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
ml = ["lightgbm>=4.0", "numpy>=1.23"]
office = ["oletools>=0.40"]
dev = ["pytest>=7.0", "pytest-timeout>=2.1"]

[project.scripts]
defentra = "defentra.cli:main"

[tool.setuptools.packages.find]
include = ["defentra*"]

[tool.setuptools.package-data]
"defentra.signing" = ["trusted_keys/*.pub"]

[tool.pytest.ini_options]
filterwarnings = [
    # third-party import-time deprecations (oletools stack on older pyparsing)
    "ignore::DeprecationWarning:colorclass.*",
    "ignore::DeprecationWarning:olefile.*",
    "ignore:.*deprecated.*:DeprecationWarning:oletools.*",
    "ignore:.*deprecated.*",
]

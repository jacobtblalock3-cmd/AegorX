[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defentra"
version = "0.4.0"
description = "Defentra - open-source AI-assisted antivirus engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Defentra Project" }]
keywords = ["antivirus", "security", "malware", "yara", "machine-learning"]
dependencies = ["cryptography>=41.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/jacobtblalock3-cmd/defentra"
Security = "https://github.com/jacobtblalock3-cmd/defentra/blob/main/SECURITY.md"

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
ml = ["lightgbm>=4.0", "numpy>=1.23"]
dev = ["pytest>=7.0"]

[project.scripts]
defentra = "defentra.cli:main"

[tool.setuptools.packages.find]
include = ["defentra*"]

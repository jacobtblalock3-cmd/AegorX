name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Build .deb package
        run: bash scripts/build_deb.sh dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Install smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/defentra --version
          /tmp/smoke/bin/defentra scan --help >/dev/null
          /tmp/smoke/bin/python - <<'PY'
          from defentra.signing.keys import trusted_key_paths
          bundled = [p for p in trusted_key_paths() if "/trusted_keys/" in p]
          assert bundled, "packaged wheel is missing the bundled root trust key"
          print("bundled trust keys:", bundled)
          PY
          echo "smoke ok"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: defentra-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "Defentra $GITHUB_REF_NAME" \
            --notes "Automated release of $GITHUB_REF_NAME. Verify with SHA256SUMS; feeds and models are Ed25519-signed."

      - name: Check PyPI credentials
        id: pypi_check
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN not set - skipping PyPI publish (GitHub Release still published)"
          fi

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.available == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          # SHA256SUMS lives in dist/ for the GitHub Release; PyPI only gets real distributions.
          packages: "dist/*.whl dist/*.tar.gz"

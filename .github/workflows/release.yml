name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # dist/ holds ONLY Python distributions (wheel + sdist) — it is fed
      # straight to PyPI. Everything release-specific (deb, checksums) is
      # staged in release-assets/ for the GitHub Release.
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Build .deb package
        run: bash scripts/build_deb.sh release-assets

      - name: Install smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/aegorx --version
          /tmp/smoke/bin/aegorx scan --help >/dev/null
          /tmp/smoke/bin/python - <<'PY'
          from aegorx.signing.keys import trusted_key_paths
          bundled = [p for p in trusted_key_paths() if "/trusted_keys/" in p]
          assert bundled, "packaged wheel is missing the bundled root trust key"
          print("bundled trust keys:", bundled)
          PY
          echo "smoke ok"

      - name: Stage release assets
        run: |
          (
            cd dist && sha256sum *.whl *.tar.gz > dist.sum
            cd ../release-assets && sha256sum * > deb.sum
            cd .. && cat dist/dist.sum release-assets/deb.sum > SHA256SUMS
            rm dist/dist.sum release-assets/deb.sum
          )
          cp SHA256SUMS release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS

      - name: Sign self-update manifest
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          pip install --quiet cryptography
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_PRIVATE_KEY secret is not set - clients could not verify self-updates"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" > signing_private.pem
          python scripts/publish_update_manifest.py \
            --version "${GITHUB_REF_NAME#v}" \
            --key signing_private.pem \
            --out release-assets/update-manifest.json \
            --artifacts dist/*.whl dist/*.tar.gz release-assets/*.deb
          rm -f signing_private.pem
          python - <<'PY'
          import json
          doc = json.load(open("release-assets/update-manifest.json"))
          assert doc["format"] == "aegorx-update-manifest" and doc["signature"]
          print("manifest ok:", doc["version"], sorted(doc["artifacts"]))
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegorx-release-${{ github.ref_name }}
          path: |
            dist/
            release-assets/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            dist/*.whl \
            dist/*.tar.gz \
            --title "AegorX $GITHUB_REF_NAME" \
            --notes "Automated release of $GITHUB_REF_NAME. Verify with SHA256SUMS; feeds and models are Ed25519-signed."

      - name: Check PyPI credentials
        id: pypi_check
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_API_TOKEN not set - skipping PyPI publish (GitHub Release still published)"
          fi

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.available == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

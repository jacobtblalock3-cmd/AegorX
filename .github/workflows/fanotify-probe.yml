name: Fanotify kernel probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Environment facts
        run: |
          uname -a
          sudo sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          python -c "import sys; print(sys.version)"

      - name: Install (user context)
        run: pip install -e ".[yara]"

      - name: Install (root context)
        run: sudo "$(which python)" -m pip install --quiet pytest yara-python

      - name: Fanotify strict-mode probe (as root)
        env:
          DEFENTRA_HOME: /tmp/defentra-probe
          DEFENTRA_FANOTIFY_STRICT: "1"
        run: |
          set +e
          sudo --preserve-env=DEFENTRA_HOME,DEFENTRA_FANOTIFY_STRICT "$(which python)" \
            -m pytest tests/test_linux_integration.py::test_fanotify_denies_malicious_open \
            -v -s --capture=no > /tmp/probe.log 2>&1
          RC=$?
          echo "exit code: $RC"
          echo "----- full output -----"
          cat /tmp/probe.log
          exit $RC

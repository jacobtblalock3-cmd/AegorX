name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[yara,ml,office,dev]"
      - name: Test
        run: pytest -q tests/

  # Cross-platform portability gate: the scan engine, fleet agent, and CLI
  # must work on Windows and macOS (realtime blocking stays Linux-only).
  test-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # Keep Defender from quarantining EICAR test files the suite writes.
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE '') -ErrorAction SilentlyContinue
      - name: Install
        run: pip install -e ".[yara,ml,office,dev]"
      - name: Test
        run: pytest -q tests/
      - name: Scan smoke test (EICAR detected, clean file passes, doctor runs)
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          pathlib.Path("smoke-eicar.com").write_bytes(
              b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*"
          )
          pathlib.Path("smoke-clean.txt").write_text("hello")
          PY
          # scanner exits 2 on malicious / 1 on suspicious by design; check output instead of pipeline status
          rc=0; python -m defentra.cli scan smoke-eicar.com > smoke.out 2>&1 || rc=$?
          cat smoke.out; [ "$rc" -eq 2 ]
          grep -q MALICIOUS smoke.out
          rc=0; python -m defentra.cli scan smoke-clean.txt > clean.out 2>&1 || rc=$?
          cat clean.out; [ "$rc" -eq 0 ]
          grep -q "clean=0 suspicious=0 malicious=1" smoke.out
          grep -q "clean=1 suspicious=0 malicious=0" clean.out
          python -m defentra.cli doctor > doctor.out 2>&1 || true
          grep -q "doctor:" doctor.out

  # Standalone frozen binaries: one-file executables for real-device testing.
  build-frozen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE '') -ErrorAction SilentlyContinue
      - name: Install build deps
        run: |
          pip install . yara-python pyinstaller
      - name: Build standalone executable
        run: pyinstaller --noconfirm --distpath dist-standalone scripts/frozen/defentra.spec
      - name: Smoke test the executable
        shell: bash
        run: |
          EXE="dist-standalone/defentra"
          [ "$RUNNER_OS" = "Windows" ] && EXE="dist-standalone/defentra.exe"
          "$EXE" --version
          printf 'X5O!P%%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > e.bin
          rc=0; "$EXE" scan e.bin > out.txt 2>&1 || rc=$?
          cat out.txt; [ "$rc" -eq 2 ]
          grep -q MALICIOUS out.txt
          "$EXE" doctor > doc.out 2>&1 || true
          grep -q "trust-keys       1 pinned package key" doc.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: defentra-${{ matrix.platform }}
          path: dist-standalone/defentra*
          if-no-files-found: error


  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain (stable, minimal)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: cargo fmt --check
        working-directory: rust-core

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust-core

      - name: Tests (known SHA-256 vectors)
        run: cargo test
        working-directory: rust-core

      - name: Extension-module feature builds
        run: cargo check --features extension-module
        working-directory: rust-core

  integration-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[yara]"
      - name: Install test deps for root
        run: |
          sudo "$(which python)" -m pip install --quiet pytest yara-python
      - name: Realtime kernel integration tests (as root)
        env:
          DEFENTRA_HOME: /tmp/defentra-integration
        run: |
          cd "$(pwd)"
          sudo --preserve-env=DEFENTRA_HOME "$(which python)" -m pytest tests/test_linux_integration.py -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install bandit[toml] pip-audit
      - name: SAST (bandit)
        run: |
          bandit -r defentra scripts --severity-level medium --skip B101,B404,B603
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --strict .
      - name: Secrets scan (pattern pass)
        run: |
          ! grep -rInE "(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
            --include='*' --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules . \
            | grep -v 'tests/test_' || {
              echo "::error::Potential secret committed"; exit 1; }

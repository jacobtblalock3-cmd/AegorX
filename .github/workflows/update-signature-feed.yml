name: Update signature feed

on:
  workflow_dispatch:
    inputs:
      ttl_hours:
        description: "Feed validity window in hours"
        required: false
        default: "168"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: signature-feed
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Ingest threat intelligence
        continue-on-error: true
        env:
          MB_KEY: ${{ secrets.MALWAREBAZAAR_KEY }}
        run: |
          if [ -n "$MB_KEY" ]; then KEYARG="--auth-key $MB_KEY"; else KEYARG=""; fi
          python scripts/fetch_intel.py \
            --store feeds/malwarebazaar.json \
            --prune-days 90 $KEYARG || {
              echo "::warning::Intel ingestion failed (abuse.ch requires a free Auth-Key)."
              echo "**Intel sources unavailable** - set the MALWAREBAZAAR_KEY secret (free key from bazaar.abuse.ch) to enable live IOC ingestion." >> "$GITHUB_STEP_SUMMARY"
            }

      - name: Commit intel store
        run: |
          git config user.name "aegorx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/malwarebazaar.json
          git diff --cached --quiet || git commit -m "intel: refresh abuse.ch store ($(date -u +%Y-%m-%d))"
          git push

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" > signing_private.pem
          chmod 600 signing_private.pem

      - name: Build and sign feed
        run: |
          mkdir -p artifacts
          python scripts/build_feed.py \
            --extra 'feeds/*.json' \
            --rules-glob 'rules/*.yar' \
            --key signing_private.pem \
            --ttl-hours "${{ github.event.inputs.ttl_hours || '168' }}" \
            --out artifacts/signatures.json

      - name: Self-verify against bundled root key
        run: python -m aegorx.cli feed verify artifacts/signatures.json

      - name: Checksums
        run: cd artifacts && sha256sum signatures.json > SHA256SUMS

      - name: Destroy signing key material
        if: always()
        run: rm -f signing_private.pem

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete signature-feed --yes --cleanup-tag || true
          gh release create signature-feed \
            artifacts/signatures.json artifacts/SHA256SUMS \
            --title "Signature feed" \
            --notes "Automated build $(date -u '+%Y-%m-%dT%H:%M:%SZ'). Verify with \`aegorx feed verify\`; install with \`aegorx feed update\`."

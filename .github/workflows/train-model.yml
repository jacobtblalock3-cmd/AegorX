name: Train reference model

on:
  workflow_dispatch:
    inputs:
      dataset_url:
        description: "URL of the EMBER 2018 archive (JSONL records with full feature groups + labels)"
        required: false
        default: "https://ember.elastic.co/ember_dataset.tar.bz2"
      rounds:
        description: "LightGBM boosting rounds"
        required: false
        default: "500"
      max_per_class:
        description: "Training cap per class (0 = use everything)"
        required: false
        default: "300000"
      publish:
        description: "Publish artifacts to the reference-model release"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: train-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[ml]"

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" > signing_private.pem
          chmod 600 signing_private.pem

      - name: Download EMBER 2018
        run: |
          curl -fSL --retry 3 -o ember.tar.bz2 "${{ github.event.inputs.dataset_url }}"
          mkdir ember
          tar -xjf ember.tar.bz2 -C ember
          find ember -type f -name '*.jsonl' -exec ls -lh {} \;

      - name: Train
        run: |
          CAP="${{ github.event.inputs.max_per_class }}"
          if [ "$CAP" = "0" ]; then CAPARG=""; else CAPARG="--max-per-class $CAP"; fi
          python scripts/train_ember.py \
            --data-dir ember \
            --out-dir artifacts \
            --sign-key signing_private.pem \
            --rounds "${{ github.event.inputs.rounds }}" \
            $CAPARG

      - name: Verify artifact integrity
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS

      - name: Destroy signing key material
        if: always()
        run: rm -f signing_private.pem

      - name: Upload model artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegorx-ember-model-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

      - name: Publish rolling reference-model release
        if: github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp artifacts/malware-ember.lgbm aegorx-ember-reference.lgbm
          cp artifacts/malware-ember.lgbm.meta.json aegorx-ember-reference.lgbm.meta.json
          TAG=reference-model
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          AUC=$(python3 -c "import json;print(json.load(open('artifacts/malware-ember.lgbm.meta.json'))['test_auc'])")
          gh release create "$TAG" \
            aegorx-ember-reference.lgbm \
            aegorx-ember-reference.lgbm.meta.json \
            artifacts/SHA256SUMS \
            --title "AegorX reference model (EMBER-2018)" \
            --notes "LightGBM static classifier trained on EMBER-2018. Held-out ROC-AUC: $AUC. Verify model_sha256 via SHA256SUMS; metadata sidecar is Ed25519-signed. Install with: aegorx model install"

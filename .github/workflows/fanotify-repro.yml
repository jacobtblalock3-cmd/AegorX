name: Fanotify header truth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dump canonical fanotify constants
        run: |
          uname -r
          grep -E "^#define (FAN_|FANOTIFY_)" /usr/include/linux/fanotify.h | grep -vE "_VERSION|SET_ATTR"
